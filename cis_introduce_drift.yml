---
# Demo helper only. Makes the kind of change a person might make by hand:
# allows root to log in over SSH, which breaks CIS 5.1.20.
#
# Used by the AAP job template "mbredeme - CIS Demo Introduce Drift" when a
# live SSH edit on stage is not practical. Auditbeat reports the file change,
# and the rulebook in rulebooks/cis_drift.yml starts the enforcement workflow.
- name: Introduce SSH configuration drift on one demo host
  hosts: cis_rhel9
  become: true
  gather_facts: false

  tasks:
    - name: Set PermitRootLogin yes in /etc/ssh/sshd_config
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^\s*#?\s*PermitRootLogin\s+'
        line: PermitRootLogin yes
        validate: /usr/sbin/sshd -t -f %s
