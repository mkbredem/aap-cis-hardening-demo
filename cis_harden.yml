---
# Applies the CIS Red Hat Enterprise Linux 9 Benchmark v2.0.0, Level 1 - Server.
#
# Used by two AAP job templates:
#   "mbredeme - CIS Check (Check Mode)"  job type Check: reports what would change
#   "mbredeme - CIS Remediate"           job type Run:   makes the changes
#
# Scope a run with the job template's Limit (a ring such as cis_canary) and
# Job Tags (one CIS section, for example the SSH rule names in README.md).
# Exceptions come from group_vars/ in this repository, not from this playbook.
- name: Apply CIS RHEL 9 Level 1 Server
  hosts: cis_rhel9
  become: true
  gather_facts: true

  pre_tasks:
    - name: Confirm the host is RHEL 9 before applying RHEL 9 CIS content
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'RedHat'
          - ansible_facts['distribution_major_version'] == '9'
        fail_msg: >-
          {{ inventory_hostname }} runs {{ ansible_facts['distribution'] }}
          {{ ansible_facts['distribution_version'] }}. This playbook applies the
          RHEL 9 CIS benchmark only.
        quiet: true
      tags: always

    # Drift suppression. The CIS role itself edits /etc/ssh/sshd_config, which
    # Auditbeat reports like any other change. When the drift workflow was
    # started by a change that automation made (a planned remediation within
    # the last cis_suppress_seconds), skip the host instead of re-running.
    - name: Read when the last planned CIS remediation ran on this host
      ansible.builtin.stat:
        path: /var/lib/cis-automation/last_remediation
      register: cis_last_run
      when: cis_triggered_by_drift | default(false) | bool
      tags: always

    - name: Skip this host if the change came from a planned remediation
      ansible.builtin.meta: end_host
      when:
        - cis_triggered_by_drift | default(false) | bool
        - cis_last_run.stat.exists | default(false)
        - (now(utc=true).timestamp() - cis_last_run.stat.mtime) < (cis_suppress_seconds | default(180) | int)
      tags: always

    # apply: tags: always passes the tag to the included tasks; without it,
    # a run limited with Job Tags skips them and no time stamp is written.
    - name: Record the start of a planned remediation
      ansible.builtin.include_tasks:
        file: tasks/record_remediation.yml
        apply:
          tags: always
      when: not ansible_check_mode
      tags: always

  roles:
    - role: RedHatOfficial.rhel9_cis_server_l1

  post_tasks:
    # apply: tags: always passes the tag to the included tasks; without it,
    # a run limited with Job Tags skips them and no time stamp is written.
    - name: Record the end of a planned remediation
      ansible.builtin.include_tasks:
        file: tasks/record_remediation.yml
        apply:
          tags: always
      when: not ansible_check_mode
      tags: always
