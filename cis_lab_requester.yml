---
# Demo setup only. First node of the workflow "mbredeme - CIS Demo Build Lab".
#
# AAP gives every job the launching user's account details as variables
# (awx_user_name, awx_user_email). set_stats publishes them as workflow
# artifacts, which AAP passes to every later node, including the nested
# Multi Hypervisor Create and Config VM workflows. Whoever launches the build
# becomes the VM owner, written to vCenter as the owner tag.
- name: Record who requested the CIS demo lab
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Stop if the launching user has no email address in AAP
      ansible.builtin.assert:
        that:
          - awx_user_email is defined
          - awx_user_email | length > 0
        fail_msg: >-
          The AAP user {{ awx_user_name | default('unknown') }} has no email
          address. Add one to the user, or launch with the variable owner set.
        quiet: true
      when: owner is not defined

    - name: Publish the owner for the VM build
      ansible.builtin.set_stats:
        data:
          owner: "{{ owner | default(awx_user_email) }}"
        per_host: false

    - name: Show the owner that the VMs will be tagged with
      ansible.builtin.debug:
        msg: "VMs will be built with owner {{ owner | default(awx_user_email) }}"
